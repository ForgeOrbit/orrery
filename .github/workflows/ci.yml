name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, typecheck, contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Generated contract is up to date
        run: |
          pnpm gen
          git diff --exit-code contract/ || {
            echo "::error::contract/ is out of date. Run 'pnpm gen' and commit the result."
            exit 1
          }
      - name: Migrations come from the Drizzle schema
        run: |
          node scripts/check-migrations.mjs
          if [ ! -f apps/server/src/db/schema.ts ]; then
            echo "No Drizzle schema yet, so there is nothing to compare."
            exit 0
          fi
          pnpm db:generate
          if [ -n "$(git status --porcelain -- db/migrations)" ]; then
            git status --porcelain -- db/migrations
            echo "::error::db/migrations/ does not match apps/server/src/db/schema.ts. Run 'pnpm db:generate' and commit the result. Don't write migrations by hand."
            exit 1
          fi

  test:
    name: Unit and Postgres tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers starts a real Postgres through the runner's Docker.
      - run: pnpm test

  e2e:
    name: End-to-end against the Docker image
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci
      # The stack's one-time setup secret (at least 32 characters); the tests must know it
      # to drive bootstrap.
      BOOTSTRAP_SECRET: ci-bootstrap-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --build --wait
      - name: Install the browser for the Playwright specs
        run: pnpm --filter @orrery/e2e exec playwright install --with-deps chromium
      - name: REST and browser checks, including a restart
        run: >
          ORRERY_URL=http://localhost:8080
          ORRERY_SETUP_SECRET=ci-bootstrap-secret-0123456789abcdef
          ORRERY_RESTART_CMD="docker compose -f $GITHUB_WORKSPACE/compose.yaml restart orrery"
          pnpm test:e2e
      # The session-cookie needle is a proxy: any logged cookie value would carry the
      # cookie's name with it.
      - name: The stack's logs contain no secrets
        if: always()
        run: >
          node scripts/check-e2e-logs.mjs
          "bootstrap-secret=$BOOTSTRAP_SECRET"
          "spec-password=browser-checked-admin-password"
          "rest-password=a-valid-password"
          "session-cookie=orrery_session"
      - if: failure()
        run: docker compose logs

  publish:
    name: Publish image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/forge-orbit/orrery
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ORRERY_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
